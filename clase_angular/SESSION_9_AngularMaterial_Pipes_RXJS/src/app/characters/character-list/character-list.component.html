@for(character of $rickMortyObservable | async; track character.id) {
  <mat-card class="example-card" appearance="outlined">
    <mat-card-header>
      <div mat-card-avatar class="example-header-image"></div>
      <mat-card-title>{{ character.name | uppercase }}</mat-card-title>
    </mat-card-header>
    <img mat-card-image [src]="character.image" alt="Photo of a Shiba Inu">
    <mat-card-content>
      <p>
        {{ character.status }}
      </p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-button>LIKE</button>
      <button mat-button>SHARE</button>
    </mat-card-actions>
  </mat-card>
}
