<div class="container">
    <form (ngSubmit)="handleLoginForm()" class="form">
      <h2 class="form-title">Formulario de Login</h2>
 
      <div class="form-group">
        <label for="username">Usuario</label>
        <input
          id="username"
          type="text"
          placeholder="Usuario"
          name="username"
          [(ngModel)]="userLoginForm.username"
          class="form-input"
          required
        />
      </div>
 
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          placeholder="Contraseña"
          name="password"
          [(ngModel)]="userLoginForm.password"
          class="form-input"
          required
        />
      </div>

      <button type="submit" class="form-button">Enviar formulario</button>
    </form>
  </div>
