<div class="container">
    <form (ngSubmit)="handleRegisterForm()" class="form">
      <h2 class="form-title">Formulario de Registro</h2>
  
      <div class="form-group">
        <label for="name">Nombre</label>
        <input
          id="name"
          type="text"
          placeholder="Nombre"
          name="name"
          [(ngModel)]="userForm.name"
          class="form-input"
          required
        />
      </div>
  
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          placeholder="Correo electrónico"
          name="email"
          [(ngModel)]="userForm.email"
          class="form-input"
          required
        />
      </div>
  
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          placeholder="Contraseña"
          name="password"
          [(ngModel)]="userForm.password"
          class="form-input"
          required
        />
      </div>
  
      <div class="form-group">
        <label for="image">Imagen de perfil</label>
        <input
        id="image"
        type="file"
        name="image"
        class="form-input"
        accept="image/*"
        (change)="handleImage($event)"
        />
      </div>
  
      <div class="form-group">
        <label for="birth">Fecha de nacimiento</label>
        <input
          id="birth"
          type="date"
          name="birth"
          [(ngModel)]="userForm.birth"
          class="form-input"
          required
        />
      </div>
  
      <button type="submit" class="form-button">Enviar formulario</button>
    </form>
  </div>
